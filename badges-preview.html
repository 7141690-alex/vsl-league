<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badges Preview</title>
  <style>
    body { background: #0f0f1a; font-family: Arial, sans-serif; padding: 40px; }
    .row { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-end; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .label { color: rgba(255,255,255,0.5); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
<div class="row">

  <!-- MVP -->
  <div class="item">
    <svg width="72" height="40" viewBox="0 0 36 20" fill="none">
      <rect width="36" height="20" rx="5" fill="#2e1065"/>
      <rect x="0.5" y="0.5" width="35" height="19" rx="4.5" stroke="#c4b5fd" stroke-opacity="0.5"/>
      <text x="18" y="14" text-anchor="middle" font-size="10" font-weight="900" fill="white" font-family="Arial" letter-spacing="1">MVP</text>
    </svg>
    <div class="label">MVP</div>
  </div>

  <!-- Setter (Связующий) -->
  <div class="item">
    <svg width="54" height="73" viewBox="0 0 20 27" fill="none">
      <rect x="8" y="0" width="4" height="11" rx="1.5" fill="#1e3a8a"/>
      <rect x="9" y="0" width="2" height="11" rx="0.8" fill="#2563eb"/>
      <rect x="9.5" y="1" width="1" height="9" rx="0.3" fill="#93c5fd" opacity="0.4"/>
      <polygon points="10,10.12 11.73,15.33 17.19,15.33 12.73,18.54 14.46,23.75 10,20.54 5.54,23.75 7.27,18.54 2.81,15.33 8.27,15.33" fill="#1e3a8a"/>

      <circle cx="10" cy="19" r="6.8" fill="#2563eb"/>
      <circle cx="10" cy="19" r="6.8" fill="none" stroke="#93c5fd" stroke-width="1.1"/>
      <circle cx="10" cy="19" r="5.1" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
      <circle cx="8.5" cy="16.5" r="2" fill="rgba(255,255,255,0.1)"/>
      <text x="10" y="21.7" text-anchor="middle" font-size="6.5" font-weight="900" fill="white" font-family="Arial">П</text>
    </svg>
    <div class="label">Связующий</div>
  </div>

  <div class="item">
    <svg width="54" height="73" viewBox="0 0 20 27" fill="none">

    </svg>
    <div class="label">Подающий</div>
  </div>

  <!-- Blocker (Блокирующий) -->

    <svg width="54" height="73" viewBox="0 0 20 27" fill="none">
      <rect x="8" y="0" width="4" height="11" rx="1.5" fill="#1e3a5f"/>
      <rect x="9" y="0" width="2" height="11" rx="0.8" fill="#0e7490"/>
      <rect x="9.5" y="1" width="1" height="9" rx="0.3" fill="#67e8f9" opacity="0.4"/>

  <!-- Libero -->

    <svg width="54" height="73" viewBox="0 0 20 27" fill="none">
      <rect x="8" y="0" width="4" height="11" rx="1.5" fill="#064e3b"/>
      <rect x="9" y="0" width="2" height="11" rx="0.8" fill="#059669"/>
      <rect x="9.5" y="1" width="1" height="9" rx="0.3" fill="#6ee7b7" opacity="0.4"/>
      <polygon points="10,10.12 11.73,15.33 17.19,15.33 12.73,18.54 14.46,23.75 10,20.54 5.54,23.75 7.27,18.54 2.81,15.33 8.27,15.33" fill="#064e3b"/>
      <polygon points="10,10.12 11.73,15.33 17.19,15.33 12.73,18.54 14.46,23.75 10,20.54 5.54,23.75 7.27,18.54 2.81,15.33 8.27,15.33" fill="none" stroke="#6ee7b7" stroke-width="0.5" opacity="0.8"/>
      <circle cx="10" cy="19" r="6.8" fill="#059669"/>
      <circle cx="10" cy="19" r="6.8" fill="none" stroke="#6ee7b7" stroke-width="1.1"/>
      <circle cx="10" cy="19" r="5.1" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
      <circle cx="8.5" cy="16.5" r="2" fill="rgba(255,255,255,0.1)"/>
      <text x="10" y="21.7" text-anchor="middle" font-size="6.5" font-weight="900" fill="white" font-family="Arial">Л</text>

</div>
