<!DOCTYPE html>
<html>
<head>

  <style>
    body { background: #0d0d1a; font-family: Arial; padding: 40px; }
    h3 { color: rgba(255,255,255,0.4); font-size: 11px; font-weight:400; margin: 32px 0 14px; letter-spacing: 2px; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 24px; }
    .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .sizes { display: flex; gap: 14px; align-items: center; }

</head>
<body>

<svg width="0" height="0">
  <defs>
    <!-- Нежный шероховатый фильтр для крупного -->
    <filter id="inkL" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="5" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Для мелкого -->
    <filter id="inkS" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
