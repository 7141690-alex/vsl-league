<body>

<svg width="0" height="0">
  <defs>
    <!-- Ink sketch roughen filter -->
    <filter id="ink1" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="noise"/>

    <filter id="ink2" x="-8%" y="-8%" width="116%" height="116%">

</svg>
